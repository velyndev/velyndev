<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none">
<!-- velyn's GitHub banner: the hero of velyn.dev (velyn-website DESIGN.md 4.1 and 8.11), the night sky and the crowned name.
     "velyn" is Inter at weight 650, display cut, -0.03em, as outlines, because an SVG shown as an image can't load fonts.
     The load intro (stars ignite, halo draws, name comes into focus) runs once, ends within 2.1 s and is skipped
     under prefers-reduced-motion; without it everything shows at rest. -->
<title>velyn</title>
<style>
@media (prefers-reduced-motion:no-preference){
.core{stroke-dasharray:457 457;animation:draw 1400ms cubic-bezier(.16,1,.3,1) 150ms both}
.glow{animation:fade 800ms cubic-bezier(0,0,.2,1) 650ms both}
.name{animation:name 1100ms cubic-bezier(.16,1,.3,1) 200ms both}
.i0{animation:fade 700ms cubic-bezier(0,0,.2,1) 0ms both}.i1{animation:fade 700ms cubic-bezier(0,0,.2,1) 150ms both}.i2{animation:fade 700ms cubic-bezier(0,0,.2,1) 300ms both}.i3{animation:fade 700ms cubic-bezier(0,0,.2,1) 450ms both}.i4{animation:fade 700ms cubic-bezier(0,0,.2,1) 600ms both}.i5{animation:fade 700ms cubic-bezier(0,0,.2,1) 750ms both}.i6{animation:fade 700ms cubic-bezier(0,0,.2,1) 900ms both}.i7{animation:fade 700ms cubic-bezier(0,0,.2,1) 1050ms both}.i8{animation:fade 700ms cubic-bezier(0,0,.2,1) 1200ms both}.i9{animation:fade 700ms cubic-bezier(0,0,.2,1) 1350ms both}
}
@keyframes draw{from{stroke-dashoffset:457}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes name{from{opacity:0;transform:translate(0,12px);filter:blur(12px)}to{opacity:1;transform:translate(0,0);filter:blur(0)}}
</style>
